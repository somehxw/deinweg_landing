<!DOCTYPE html>
<html lang="ua">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deinweg - Заявка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #5645d4;
      --primary-pressed: #4534b3;
      --canvas: #ffffff;
      --surface: #f6f5f4;
      --hairline: #e5e3df;
      --hairline-strong: #c8c4be;
      --ink: #1a1a1a;
      --charcoal: #37352f;
      --slate: #5d5b54;
      --error: #e03131;
      --success: #1aae39;
    }

    html[data-theme="dark"] {
      --canvas: #0f141c;
      --surface: #161d27;
      --hairline: #2a3442;
      --hairline-strong: #3a4556;
      --ink: #edf1f7;
      --charcoal: #dfe6ef;
      --slate: #b4bfd0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    .container {
      width: min(100% - 32px, 900px);
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--hairline);
      background: color-mix(in oklab, var(--canvas) 92%, transparent);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .topbar-inner {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      font-size: 20px;
    }

    .mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      font-size: 15px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn,
    select,
    input {
      min-height: 44px;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
    }

    .btn {
      border: 1px solid transparent;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn.primary {
      background: var(--primary);
      color: #fff;
    }

    .btn.primary:hover { background: var(--primary-pressed); }

    .btn.secondary {
      border-color: var(--hairline-strong);
      background: var(--canvas);
      color: var(--ink);
    }

    .section { padding: 36px 0 56px; }

    .panel {
      border: 1px solid var(--hairline);
      border-radius: 12px;
      background: var(--canvas);
      padding: 24px;
    }

    .headline {
      margin: 0 0 8px;
      font-size: clamp(30px, 4.6vw, 46px);
      line-height: 1.12;
      font-weight: 600;
    }

    .subline {
      margin: 0 0 24px;
      color: var(--slate);
      font-size: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--charcoal);
    }

    input, select {
      width: 100%;
      border: 1px solid var(--hairline-strong);
      padding: 10px 12px;
      background: var(--canvas);
      color: var(--ink);
    }

    input:focus, select:focus {
      outline: 2px solid var(--primary);
      outline-offset: -1px;
      border-color: transparent;
    }

    .status-line {
      margin: 14px 0 0;
      font-size: 14px;
      font-weight: 500;
    }

    .status-line.error { color: var(--error); }
    .status-line.success { color: var(--success); }

    .actions {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .json-box {
      margin-top: 18px;
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 14px;
      background: var(--surface);
    }

    .json-title {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--charcoal);
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      color: var(--ink);
    }

    @media (max-width: 760px) {
      .form-grid { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
      .subline { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="./landing.html">
        <span class="mark">d</span>
        <span>deinweg</span>
      </a>
      <div class="controls">
        <select id="lang-switch" aria-label="Language">
          <option value="ua">UA</option>
          <option value="de">DE</option>
        </select>
        <button id="theme-toggle" class="btn secondary" type="button">Theme</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <section class="panel">
        <h1 class="headline" data-i18n="title">Заявка на навчання</h1>
        <p class="subline" data-i18n="subtitle">Заповніть форму та надішліть заявку до школи.</p>

        <form id="enrollment-form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="parent_email" data-i18n="parent_email">Email одного з батьків</label>
              <input id="parent_email" name="parent_email" type="email" required />
            </div>
            <div class="field">
              <label for="parent_first_name" data-i18n="parent_first_name">Ім'я одного з батьків</label>
              <input id="parent_first_name" name="parent_first_name" type="text" minlength="2" required />
            </div>
            <div class="field">
              <label for="parent_last_name" data-i18n="parent_last_name">Прізвище одного з батьків</label>
              <input id="parent_last_name" name="parent_last_name" type="text" minlength="2" required />
            </div>
            <div class="field">
              <label for="phone" data-i18n="phone">Телефон</label>
              <input id="phone" name="phone" type="tel" />
            </div>
            <div class="field">
              <label for="preferred_locale" data-i18n="preferred_locale">Бажана мова</label>
              <select id="preferred_locale" name="preferred_locale" required>
                <option value="ua">UA</option>
                <option value="de">DE</option>
              </select>
            </div>
            <div class="field">
              <label for="student_first_name" data-i18n="student_first_name">Ім'я дитини</label>
              <input id="student_first_name" name="student_first_name" type="text" required />
            </div>
            <div class="field">
              <label for="student_last_name" data-i18n="student_last_name">Прізвище дитини</label>
              <input id="student_last_name" name="student_last_name" type="text" required />
            </div>
            <div class="field">
              <label for="student_birth_date" data-i18n="student_birth_date">Дата народження дитини</label>
              <input id="student_birth_date" name="student_birth_date" type="date" required />
            </div>
            <div class="field">
              <label for="student_email" data-i18n="student_email">Email дитини (необов'язково)</label>
              <input id="student_email" name="student_email" type="email" />
            </div>
          </div>

          <div class="actions">
            <button class="btn primary" type="submit" id="submit-btn" data-i18n="submit">Надіслати заявку</button>
            <button class="btn secondary" type="reset" data-i18n="reset">Очистити</button>
          </div>
          <p id="status-line" class="status-line"></p>
        </form>

        <div class="json-box">
          <h2 class="json-title" data-i18n="request_preview">Request body</h2>
          <pre id="request-preview">{}</pre>
        </div>
        <div class="json-box">
          <h2 class="json-title" data-i18n="response_preview">Response</h2>
          <pre id="response-preview">-</pre>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      const API_BASE = "https://deinweg-api.i-lab.ink";
      const LANG_KEY = "deinweg_lang";
      const THEME_KEY = "deinweg_theme";

      const i18n = {
        ua: {
          title: "Заявка на навчання",
          subtitle: "Заповніть форму та надішліть заявку до школи.",
          parent_email: "Email одного з батьків",
          parent_first_name: "Ім'я одного з батьків",
          parent_last_name: "Прізвище одного з батьків",
          phone: "Телефон",
          preferred_locale: "Бажана мова",
          student_first_name: "Ім'я дитини",
          student_last_name: "Прізвище дитини",
          student_birth_date: "Дата народження дитини",
          student_email: "Email дитини (необов'язково)",
          submit: "Надіслати заявку",
          reset: "Очистити",
          request_preview: "Request body",
          response_preview: "Response",
          sending: "Відправлення...",
          sent_ok: "Заявку успішно створено.",
          sent_err: "Не вдалося надіслати заявку."
        },
        de: {
          title: "Anmeldung",
          subtitle: "Füllen Sie das Formular aus und senden Sie die Anfrage.",
          parent_email: "E-Mail eines Elternteils",
          parent_first_name: "Vorname eines Elternteils",
          parent_last_name: "Nachname eines Elternteils",
          phone: "Telefon",
          preferred_locale: "Bevorzugte Sprache",
          student_first_name: "Vorname des Kindes",
          student_last_name: "Nachname des Kindes",
          student_birth_date: "Geburtsdatum des Kindes",
          student_email: "E-Mail des Kindes (optional)",
          submit: "Anfrage senden",
          reset: "Zurücksetzen",
          request_preview: "Request body",
          response_preview: "Response",
          sending: "Wird gesendet...",
          sent_ok: "Anfrage erfolgreich erstellt.",
          sent_err: "Anfrage konnte nicht gesendet werden."
        }
      };

      const form = document.getElementById("enrollment-form");
      const langSwitch = document.getElementById("lang-switch");
      const themeToggle = document.getElementById("theme-toggle");
      const submitBtn = document.getElementById("submit-btn");
      const statusLine = document.getElementById("status-line");
      const reqPreview = document.getElementById("request-preview");
      const resPreview = document.getElementById("response-preview");

      function getLang() {
        const value = localStorage.getItem(LANG_KEY);
        return value === "de" ? "de" : "ua";
      }

      function applyLang(lang) {
        const dict = i18n[lang] || i18n.ua;
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (key && dict[key]) el.textContent = dict[key];
        });
        langSwitch.value = lang;
      }

      function applyTheme(theme) {
        const next = theme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem(THEME_KEY, next);
        themeToggle.textContent = next === "dark" ? "Light" : "Dark";
      }

      function normalizePhone(value) {
        return String(value || "").replace(/[^\d+]/g, "");
      }

      function collectPayload() {
        const fd = new FormData(form);
        const payload = {
          parent_email: String(fd.get("parent_email") || "").trim(),
          parent_first_name: String(fd.get("parent_first_name") || "").trim(),
          parent_last_name: String(fd.get("parent_last_name") || "").trim(),
          phone: normalizePhone(fd.get("phone")),
          preferred_locale: String(fd.get("preferred_locale") || "ua"),
          student_first_name: String(fd.get("student_first_name") || "").trim(),
          student_last_name: String(fd.get("student_last_name") || "").trim(),
          student_birth_date: String(fd.get("student_birth_date") || ""),
          student_email: String(fd.get("student_email") || "").trim()
        };
        if (!payload.phone) delete payload.phone;
        if (!payload.student_email) delete payload.student_email;
        return payload;
      }

      function renderRequestPreview() {
        reqPreview.textContent = JSON.stringify(collectPayload(), null, 2);
      }

      function setStatus(kind, text) {
        statusLine.className = "status-line " + (kind || "");
        statusLine.textContent = text || "";
      }

      form.addEventListener("input", renderRequestPreview);
      form.addEventListener("change", renderRequestPreview);
      form.addEventListener("reset", () => {
        window.setTimeout(() => {
          setStatus("", "");
          resPreview.textContent = "-";
          renderRequestPreview();
        }, 0);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;

        const lang = getLang();
        const dict = i18n[lang] || i18n.ua;
        const payload = collectPayload();
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const birthDate = new Date(payload.student_birth_date);
        if (birthDate > today) {
          setStatus("error", lang === "de" ? "Geburtsdatum darf nicht in der Zukunft liegen." : "Дата народження не може бути в майбутньому.");
          return;
        }

        submitBtn.disabled = true;
        setStatus("", dict.sending);
        resPreview.textContent = "-";

        try {
          const response = await fetch(API_BASE + "/api/v1/enrollment-requests/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await response.json().catch(() => ({}));
          resPreview.textContent = JSON.stringify({ status: response.status, data }, null, 2);
          if (response.ok) {
            setStatus("success", dict.sent_ok);
          } else {
            setStatus("error", dict.sent_err);
          }
        } catch (error) {
          resPreview.textContent = JSON.stringify({ error: String(error) }, null, 2);
          setStatus("error", dict.sent_err);
        } finally {
          submitBtn.disabled = false;
        }
      });

      langSwitch.addEventListener("change", () => {
        const lang = langSwitch.value === "de" ? "de" : "ua";
        localStorage.setItem(LANG_KEY, lang);
        applyLang(lang);
      });

      themeToggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") || "light";
        applyTheme(current === "dark" ? "light" : "dark");
      });

      const savedTheme = localStorage.getItem(THEME_KEY) || "light";
      const savedLang = getLang();
      applyTheme(savedTheme);
      applyLang(savedLang);
      renderRequestPreview();
    })();
  </script>
</body>
</html>
